[package]
name = "git-canopy"
version = "0.4.0"
edition = "2024"
description = "Many trees, one canopy: a live TUI showing every git worktree of a repo at a glance"
authors = ["Biao Geng <biao.geng.me@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/biao-geng-me/git-canopy"
homepage = "https://github.com/biao-geng-me/git-canopy"
keywords = ["git", "worktree", "tui", "agents", "graph"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "canopy"
path = "src/lib.rs"

[[bin]]
name = "canopy"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.190"
notify = { version = "8.2.0", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
unicode-width = "0.2.2"
vt100 = "0.16.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
